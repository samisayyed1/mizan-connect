[package]
name = "mizan-connect"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Mizan Connect — proprietary backend for Mizan desktop"
license = "Proprietary"
publish = false

[lib]
name = "mizan_connect"
path = "src/lib.rs"

[[bin]]
name = "mizan-connect"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 1

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "sync", "fs", "time"] }
tokio-util = "0.7"

# HTTP server
axum = { version = "0.7", features = ["macros", "json", "tracing", "http2"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "set-header", "request-id", "util", "timeout", "compression-gzip"] }
tower_governor = "0.4"
governor = "0.6"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "macros", "migrate", "json", "time", "ipnetwork"] }
ipnetwork = "0.20"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Datetime — only `time`, never chrono
time = { version = "0.3", features = ["serde", "serde-well-known", "macros", "formatting", "parsing"] }

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# JWT verification
jsonwebtoken = "9"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }

# Sentry (optional, controlled by env)
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tower"] }
sentry-tower = { version = "0.34", features = ["http"] }
sentry-tracing = "0.34"

# Config / env
figment = { version = "0.10", features = ["env", "toml"] }
dotenvy = "0.15"

# Misc
async-trait = "0.1"
once_cell = "1"
futures = "0.3"
http = "1"
http-body-util = "0.1"
bytes = "1"
parking_lot = "0.12"
secrecy = "0.10"
base64 = "0.22"

# SnapTrade integration (Chunk 3)
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"
url = "2.5"

# Build info
rustc_version_runtime = "0.3"

[build-dependencies]
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serial_test = "3"
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
# Tests pull in lots of unwrap/expect; allow them per CLAUDE.md.
# Lib-only lints stay strict via the warn set above.
type_complexity = "allow"
large_enum_variant = "allow"
result_large_err = "allow"
